<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Dispositivos - ID Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen">

    <header class="bg-[#1a237e] text-white p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <i class="ph-bold ph-barcode text-2xl"></i>
            <h1 class="font-bold text-lg">Gestão de Dispositivos - ID Logistics</h1>
        </div>
        <div class="bg-[#283593] px-4 py-1.5 rounded-full flex items-center gap-2 text-sm">
            <span class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></span>
            Pronto para Bipar
        </div>
    </header>

    <main class="p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-3 bg-white rounded-xl shadow-md p-6">
            <h2 class="text-sm font-bold text-blue-900 mb-6 flex items-center gap-2">
                <i class="ph ph-chart-pie"></i> Estado Global de PDAs
            </h2>
            <div class="grid grid-cols-3 gap-2 mb-8">
                <div class="text-center p-2 bg-blue-50 rounded-lg">
                    <p class="text-[10px] font-bold text-blue-700">ATIVAS</p>
                    <p id="kpi-ativas" class="text-xl font-black">0</p>
                </div>
                <div class="text-center p-2 bg-green-50 rounded-lg">
                    <p class="text-[10px] font-bold text-green-700">EM USO</p>
                    <p id="kpi-uso" class="text-xl font-black">0</p>
                </div>
                <div class="text-center p-2 bg-red-50 rounded-lg">
                    <p class="text-[10px] font-bold text-red-700">ATRASO</p>
                    <p id="kpi-atraso" class="text-xl font-black">0</p>
                </div>
            </div>
            <div class="h-48 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 text-xs">
                Gráfico Disponível
            </div>
        </div>

        <div class="lg:col-span-5 bg-white rounded-xl shadow-md p-10 flex flex-col items-center justify-center text-center">
            <i class="ph ph-scan text-6xl text-blue-600 mb-4"></i>
            <h2 class="text-2xl font-black text-slate-800 uppercase">Central de Acesso</h2>
            <p class="text-slate-500 text-sm mb-8">Bipe o Patrimônio da <b>PDA</b> ou a sua <b>Matrícula</b>.</p>
            
            <div class="w-full max-w-sm flex gap-2">
                <input type="text" id="scanner" autofocus placeholder="INSERIR CÓDIGO..." 
                       class="w-full border-2 border-blue-400 rounded-xl px-4 py-3 text-center font-bold text-lg focus:ring-4 focus:ring-blue-100 outline-none">
                <button onclick="processarBipe()" class="bg-blue-600 text-white px-4 rounded-xl hover:bg-blue-700">
                    <i class="ph ph-arrow-right font-bold"></i>
                </button>
            </div>
            
            <button class="mt-6 border border-slate-300 px-6 py-2 rounded-xl text-slate-600 text-sm font-bold flex items-center gap-2 hover:bg-slate-50">
                <i class="ph ph-printer"></i> Reimprimir Etiqueta
            </button>
        </div>

        <div class="lg:col-span-4 bg-white rounded-xl shadow-md p-6">
            <h2 class="text-sm font-bold text-blue-900 mb-6 flex items-center gap-2">
                <i class="ph ph-headset"></i> Abertura de Chamado
            </h2>
            <form id="form-chamado" class="space-y-4">
                <div class="grid grid-cols-2 gap-4 text-xs font-bold text-slate-600">
                    <div>
                        <label>Solicitação</label>
                        <select id="ch-tipo" class="w-full border p-2 rounded-lg mt-1 font-normal">
                            <option>Selecione...</option>
                            <option value="MANUTENCAO">Manutenção PDA</option>
                        </select>
                    </div>
                    <div>
                        <label>Prioridade</label>
                        <select id="ch-prioridade" class="w-full border p-2 rounded-lg mt-1 font-normal">
                            <option>Nível...</option>
                            <option value="ALTA">Alta</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 text-xs font-bold text-slate-600">
                    <input type="text" id="ch-mat" placeholder="Sua Matrícula" class="border p-2 rounded-lg font-normal">
                    <input type="text" id="ch-pda" placeholder="Patrimônio PDA" class="border p-2 rounded-lg font-normal uppercase">
                </div>
                <textarea id="ch-desc" placeholder="Descreva o problema..." class="w-full border p-2 rounded-lg h-24 text-sm"></textarea>
                <button type="button" onclick="enviarChamado()" class="w-full bg-[#1a237e] text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                    <i class="ph ph-paper-plane"></i> Enviar Solicitação
                </button>
            </form>
        </div>
    </main>

    <script>
        const CONFIG = {
            URL: "https://script.google.com/macros/s/AKfycbzpnb6zyT2u7HmPXbKG3y_Puxm04IfGXbq21R6dcosdgy5IJPmmg0-F89zHSA6DQK1y/exec",
            TOKEN: "IDL_SECURITY_2026"
        };

        async function processarBipe() {
            const val = document.getElementById('scanner').value;
            if(!val) return;
            
            await fetch(CONFIG.URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    token: CONFIG.TOKEN,
                    matricula: val.length < 10 ? val : "PDA_SCAN",
                    patrimonio: val.length >= 10 ? val : "MAT_SCAN",
                    operacao: "Saída" 
                })
            });
            alert("Registrado!");
            document.getElementById('scanner').value = '';
        }

        async function enviarChamado() {
            await fetch(CONFIG.URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    token: CONFIG.TOKEN,
                    action: "CHAMADO",
                    tipo: document.getElementById('ch-tipo').value,
                    prioridade: document.getElementById('ch-prioridade').value,
                    matricula: document.getElementById('ch-mat').value,
                    pda: document.getElementById('ch-pda').value,
                    descricao: document.getElementById('ch-desc').value
                })
            });
            alert("Chamado Aberto!");
            document.getElementById('form-chamado').reset();
        }
    </script>
</body>
</html>
